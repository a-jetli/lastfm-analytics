# CI + CD. Two jobs, one file:
#   test    run the suite on every push and pull request
#   deploy  ship main to the EC2 box, ONLY if test passed
#
# One file because `needs:` only works between jobs in the same workflow, and
# that dependency is what makes this a pipeline rather than two automations.
# This is continuous DEPLOYMENT (unattended); swap the push condition on deploy
# for workflow_dispatch to get delivery-with-a-button instead.
# Design notes: notes/CD_PLAN.md
name: ci-cd
on: [push, pull_request]

jobs:
  # ---------------------------------------------------------------- CI ------
  # Most of the suite is SQL against a real Postgres, so a service container
  # runs beside the job. No skip-if-missing: if it fails to start, the tests
  # fail. A green check on a run that never touched the SQL is worse than red.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same major version as docker-compose.yml and the deployed box, so the
        # tests can't pass here against SQL the production server would reject.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the job can start connecting before Postgres is up.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # httpx is test-only (TestClient runs on it) and stays out of
      # requirements.txt so it can't reach the runtime image. Pinned so an
      # upstream release can't turn this red with no commit behind it.
      - name: Install
        run: pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1

      - name: Test
        # Points the tests at the service container; they create and drop
        # their own lastfm_test database off it.
        run: pytest -q
        env:
          TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # ---------------------------------------------------------------- CD ------
  # Rudimentary on purpose: ssh in and run the commands you'd type by hand, so
  # the fallback when this breaks is obvious. INERT until the repo variable
  # DEPLOY_ENABLED=true exists. Server setup + secrets: notes/CD_PLAN.md
  deploy:
    needs: test # THE line. No green tests, no deploy.
    runs-on: ubuntu-latest
    # Three guards: pushes only (a pull request must never deploy), main only,
    # and the kill switch so this stays dormant until the box exists.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Load the SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # A file, not an argument: command lines show in the process list.
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Trust on first use: protects against a MITM appearing later, not
          # one present right now. Fine for a box you own.
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull and restart on the box
        # --build means the image is built ON the 1 GB instance, which also
        # runs Postgres. Slow but works; Tier 2 in CD_PLAN.md moves it here.
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'set -e
             cd ~/lastfm-analytics
             git pull --ff-only
             docker compose up -d --build --remove-orphans
             # Dangling only, never -a: the previous tagged image is the
             # rollback, and the free tier disk is 8 GB.
             docker image prune -f'

      - name: Smoke test
        # A deploy that reports success while the app 500s is worse than one
        # that fails. Retried because uvicorn takes a moment to bind.
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 5 "http://${{ secrets.EC2_HOST }}:8000/health"; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "app did not come back healthy after the deploy"; exit 1
