# ci and cd. two jobs, one file:
#   test    run the suite on every push and pull request
#   deploy  ship main to the ec2 box, only if test passed
#
# one file because `needs:` only works between jobs in the same workflow, and
# that dependency is what makes this a pipeline rather than two automations.
# this is continuous deployment, unattended. swap the push condition on deploy
# for workflow_dispatch to get delivery with a button instead.
# design notes: notes/CD_PLAN.md
name: ci-cd
on: [push, pull_request]

jobs:
  # ---------------------------------------------------------------- CI ------
  # most of the suite is sql against a real postgres, so a service container runs
  # beside the job. no skip-if-missing: if it fails to start, the tests fail. a
  # green check on a run that never touched the sql is worse than a red one.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # same major version as docker-compose.yml and the deployed box, so the
        # tests cannot pass here against sql production would reject.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # without this the job can start connecting before postgres is up
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # httpx is test-only, since TestClient runs on it, and stays out of
      # requirements.txt so it cannot reach the runtime image. pinned so an
      # upstream release cannot turn this red with no commit behind it.
      - name: Install
        run: pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1

      - name: Test
        # points the tests at the service container. they create and drop their
        # own lastfm_test database off it.
        run: pytest -q
        env:
          TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # ---------------------------------------------------------------- CD ------
  # rudimentary on purpose: ssh in and run the commands you would type by hand,
  # so the fallback when this breaks is obvious. inert until the repo variable
  # DEPLOY_ENABLED=true exists. server setup and secrets: notes/CD_PLAN.md
  deploy:
    needs: test  # the line that matters. no green tests, no deploy.
    runs-on: ubuntu-latest
    # three guards: pushes only, since a pull request must never deploy, main
    # only, and a kill switch so this stays dormant until the box exists.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Load the SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # a file, not an argument. command lines show in the process list.
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # trust on first use. protects against a mitm appearing later, not one
          # present right now. fine for a box you own.
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull and restart on the box
        # --build means the image is built on the 1 gb instance, which also runs
        # postgres. slow but it works. tier 2 in CD_PLAN.md moves it here.
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'set -e
             cd ~/lastfm-analytics
             git pull --ff-only
             docker compose up -d --build --remove-orphans
             # dangling only, never -a. the previous tagged image is the
             # rollback, and the free tier disk is 8 gb.
             docker image prune -f'

      - name: Smoke test
        # hits the public hostname, not the instance ip, because that is the
        # path a real visitor takes. it proves the tunnel is up, not just the
        # container. a deploy that reports success while the app 500s is worse
        # than one that fails. retried because uvicorn takes a moment to bind and
        # the tunnel needs a beat to reconnect.
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "https://rotation.ajetli.com/health"; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "app did not come back healthy after the deploy"; exit 1
