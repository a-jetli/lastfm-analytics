# Run the test suite on every push and PR. The tests are pure functions
# (recommender math), so no database service is needed; add a postgres service
# container here if DB-level tests ever appear.
name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest
