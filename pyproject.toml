[tool.pytest.ini_options]
# the repo root has no setup.py or package install, so pytest has to be told
# where `app` lives. without this, `from app import ...` only works if PYTHONPATH
# is set by hand, which is how it silently worked for a while.
pythonpath = ["."]

# --strict-markers makes an unregistered @pytest.mark.foo an error rather than a
# warning, so the list below is the whole set and can be trusted.
# it does not cover the -m expression, which pytest never validates: a typo like
# `pytest -m "not bd"` matches nothing, deselects nothing and quietly runs
# everything. check the deselected count in the summary line.
addopts = "--strict-markers"

markers = [
    # applied automatically in tests/conftest.py to anything reaching the db_url
    # fixture, so it never goes stale. `pytest -m "not db"` is the supported way
    # to run without a postgres.
    "db: needs a live Postgres server",
]
